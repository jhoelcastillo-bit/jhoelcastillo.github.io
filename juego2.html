
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;700&display=swap');
  .cw-wrap { font-family: 'IM Fell English', serif; padding: 1rem 0; }
  .cw-title { font-family: 'Cinzel', serif; text-align: center; font-size: 22px; color: #6b2d0f; letter-spacing: 2px; margin-bottom: 4px; }
  .cw-sub { text-align: center; font-size: 13px; color: #8b6045; font-style: italic; margin-bottom: 1.5rem; }
  .cw-body { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
  .cw-grid-wrap { background: #f5e9d0; border: 2px solid #8b5e3c; border-radius: 8px; padding: 1rem; box-shadow: inset 0 0 12px rgba(120,70,20,0.15); }
  .cw-grid { display: grid; gap: 2px; }
  .cw-cell { width: 34px; height: 34px; position: relative; }
  .cw-cell input { width: 100%; height: 100%; border: 1px solid #a0622a; background: #fdf5e6; text-align: center; font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; color: #4a2000; text-transform: uppercase; cursor: pointer; outline: none; border-radius: 2px; padding: 0; box-sizing: border-box; }
  .cw-cell input:focus { background: #fff3cc; border-color: #6b2d0f; }
  .cw-cell input.correct { background: #c8e6c9 !important; color: #1b5e20; }
  .cw-cell input.wrong { background: #ffcdd2 !important; color: #b71c1c; }
  .cw-cell input.revealed { background: #ffe082 !important; color: #4a2000; }
  .cw-cell.blocked { background: #4a2000; border-radius: 2px; }
  .cw-num { position: absolute; top: 1px; left: 2px; font-size: 8px; color: #6b2d0f; font-family: 'Cinzel', serif; font-weight: 700; line-height: 1; pointer-events: none; z-index: 2; }
  .cw-clues { min-width: 220px; max-width: 280px; }
  .cw-clues-title { font-family: 'Cinzel', serif; font-size: 14px; color: #6b2d0f; border-bottom: 1px solid #8b5e3c; padding-bottom: 4px; margin-bottom: 8px; }
  .cw-clue { font-size: 12.5px; color: #4a2000; margin-bottom: 6px; line-height: 1.4; cursor: pointer; padding: 3px 5px; border-radius: 4px; }
  .cw-clue:hover { background: rgba(139,94,60,0.12); }
  .cw-clue.active { background: #fff3cc; border-left: 3px solid #c0392b; padding-left: 6px; }
  .cw-clue b { font-family: 'Cinzel', serif; color: #6b2d0f; }
  .cw-btns { display: flex; gap: 8px; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
  .cw-btn { font-family: 'Cinzel', serif; font-size: 12px; padding: 6px 14px; border: 1.5px solid #8b5e3c; background: #f5e9d0; color: #4a2000; border-radius: 4px; cursor: pointer; letter-spacing: 1px; }
  .cw-btn:hover { background: #e8d5b0; }
  .cw-btn.primary { background: #6b2d0f; color: #fdf5e6; border-color: #4a2000; }
  .cw-btn.primary:hover { background: #8b3a12; }
  .cw-score { text-align: center; font-family: 'Cinzel', serif; font-size: 14px; color: #6b2d0f; margin-top: 8px; min-height: 22px; }
  .cw-msg { text-align: center; font-size: 13px; font-style: italic; color: #8b6045; margin-top: 6px; min-height: 18px; }
</style>
<div class="cw-wrap">
  <h2 class="cw-title">✦ Crucigrama ✦</h2>
  <p class="cw-sub">La Leyenda de la Virgen del Rosario de Tumianuma</p>
  <div class="cw-body">
    <div>
      <div class="cw-grid-wrap">
        <div class="cw-grid" id="grid"></div>
      </div>
      <div class="cw-btns">
        <button class="cw-btn" onclick="checkAll()">Verificar</button>
        <button class="cw-btn" onclick="revealOne()">Revelar letra</button>
        <button class="cw-btn primary" onclick="resetAll()">Reiniciar</button>
      </div>
      <div class="cw-score" id="score"></div>
      <div class="cw-msg" id="msg"></div>
    </div>
    <div class="cw-clues">
      <div class="cw-clues-title">↔ Horizontales</div>
      <div id="across-clues"></div>
      <div class="cw-clues-title" style="margin-top:1rem">↕ Verticales</div>
      <div id="down-clues"></div>
    </div>
  </div>
</div>
<script>
const ROWS = 11, COLS = 11;
const words = [
  { word: 'PISCOBAMBA', row: 0, col: 0, dir: 'A', num: 1, clue: 'Río donde fue hallada la Virgen.' },
  { word: 'ROSARIO',    row: 2, col: 0, dir: 'A', num: 3, clue: 'Virgen del ___, patrona de Tumianuma.' },
  { word: 'CAPILLA',    row: 4, col: 0, dir: 'A', num: 5, clue: 'Pequeño templo que construyó el pueblo.' },
  { word: 'ESPIRITU',   row: 6, col: 0, dir: 'A', num: 7, clue: 'Hombre misterioso de gran fe que recogió la imagen.' },
  { word: 'DEBEK',      row: 8, col: 0, dir: 'A', num: 9, clue: 'Capilla hecha de palo y barro.' },
  { word: 'AGOSTO',     row: 10, col: 0, dir: 'A', num: 11, clue: 'Mes en que se celebra la fiesta (el 15).' },
  { word: 'PUEBLO',     row: 0, col: 4, dir: 'D', num: 2, clue: 'Comunidad unida por la fe.' },
  { word: 'SABANA',     row: 1, col: 6, dir: 'D', num: 4, clue: 'Tela con que envolvieron a la Virgen.' },
  { word: 'TUMIANUMA',  row: 2, col: 2, dir: 'D', num: 6, clue: 'Barrio donde ocurrió el milagro.' },
  { word: 'FE',         row: 4, col: 8, dir: 'D', num: 8, clue: 'Valor espiritual que unía al pueblo.' },
  { word: 'BAREQUE',    row: 5, col: 4, dir: 'D', num: 10, clue: 'Material con que eran las casitas del barrio.' },
];

const grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
const answers = Array.from({length: ROWS}, () => Array(COLS).fill(''));
const nums = Array.from({length: ROWS}, () => Array(COLS).fill(0));

words.forEach(w => {
  for (let i = 0; i < w.word.length; i++) {
    const r = w.dir === 'A' ? w.row : w.row + i;
    const c = w.dir === 'A' ? w.col + i : w.col;
    if (r < ROWS && c < COLS) {
      answers[r][c] = w.word[i];
      grid[r][c] = true;
    }
  }
  nums[w.row][w.col] = w.num;
});

function buildGrid() {
  const g = document.getElementById('grid');
  g.style.gridTemplateColumns = `repeat(${COLS}, 34px)`;
  g.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cw-cell';
      if (!grid[r][c]) {
        cell.classList.add('blocked');
      } else {
        if (nums[r][c]) {
          const n = document.createElement('span');
          n.className = 'cw-num';
          n.textContent = nums[r][c];
          cell.appendChild(n);
        }
        const inp = document.createElement('input');
        inp.maxLength = 1;
        inp.dataset.r = r; inp.dataset.c = c;
        inp.addEventListener('input', e => {
          e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,'');
          e.target.classList.remove('correct','wrong','revealed');
          autoAdvance(r, c);
        });
        inp.addEventListener('keydown', handleKey);
        inp.addEventListener('focus', () => highlightWord(r, c));
        cell.appendChild(inp);
      }
      g.appendChild(cell);
    }
  }
}

let activeDir = 'A';
function highlightWord(r, c) {
  clearHighlight();
  words.filter(w => {
    if (w.dir === 'A' && w.row === r && c >= w.col && c < w.col + w.word.length) return true;
    if (w.dir === 'D' && w.col === c && r >= w.row && r < w.row + w.word.length) return true;
    return false;
  }).forEach(w => {
    for (let i = 0; i < w.word.length; i++) {
      const wr = w.dir === 'A' ? w.row : w.row + i;
      const wc = w.dir === 'A' ? w.col + i : w.col;
      const inp = getInput(wr, wc);
      if (inp && !inp.classList.contains('correct')) inp.style.background = '#ffe9a0';
    }
    document.querySelectorAll('.cw-clue').forEach(el => {
      if (el.dataset.num == w.num && el.dataset.dir == w.dir) el.classList.add('active');
    });
  });
}
function clearHighlight() {
  document.querySelectorAll('.cw-cell input').forEach(i => {
    if (!i.classList.contains('correct') && !i.classList.contains('wrong') && !i.classList.contains('revealed'))
      i.style.background = '';
  });
  document.querySelectorAll('.cw-clue').forEach(e => e.classList.remove('active'));
}
function getInput(r, c) {
  return document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
}
function autoAdvance(r, c) {
  const nextR = r, nextC = c + 1;
  const di = getInput(r + 1, c);
  const ai = getInput(nextR, nextC);
  if (ai && answers[nextR][nextC]) ai.focus();
}
function handleKey(e) {
  const r = +e.target.dataset.r, c = +e.target.dataset.c;
  if (e.key === 'ArrowRight') { const i = getInput(r, c+1); if(i) i.focus(); }
  if (e.key === 'ArrowLeft')  { const i = getInput(r, c-1); if(i) i.focus(); }
  if (e.key === 'ArrowDown')  { const i = getInput(r+1, c); if(i) i.focus(); }
  if (e.key === 'ArrowUp')    { const i = getInput(r-1, c); if(i) i.focus(); }
  if (e.key === 'Backspace' && e.target.value === '') {
    const prev = getInput(r, c-1) || getInput(r-1, c);
    if (prev) { prev.value = ''; prev.focus(); }
  }
}
function checkAll() {
  let correct = 0, total = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!answers[r][c]) continue;
      const inp = getInput(r, c);
      if (!inp) continue;
      total++;
      if (inp.value === answers[r][c]) { inp.classList.add('correct'); inp.classList.remove('wrong','revealed'); correct++; }
      else if (inp.value) { inp.classList.add('wrong'); inp.classList.remove('correct','revealed'); }
    }
  }
  document.getElementById('score').textContent = `${correct} / ${total} correctas`;
  if (correct === total) document.getElementById('msg').textContent = '¡Alabado sea! Completaste el crucigrama con fe y sabiduría.';
  else document.getElementById('msg').textContent = 'Sigue intentando, la Virgencita te guía.';
}
function revealOne() {
  const inputs = [...document.querySelectorAll('.cw-cell input')].filter(i => !i.classList.contains('correct') && !i.classList.contains('revealed'));
  if (!inputs.length) return;
  const inp = inputs[Math.floor(Math.random() * inputs.length)];
  const r = +inp.dataset.r, c = +inp.dataset.c;
  inp.value = answers[r][c];
  inp.classList.add('revealed');
  inp.classList.remove('wrong');
}
function resetAll() {
  document.querySelectorAll('.cw-cell input').forEach(i => { i.value = ''; i.className = ''; i.style.background = ''; });
  document.getElementById('score').textContent = '';
  document.getElementById('msg').textContent = '';
}
function buildClues() {
  const ac = document.getElementById('across-clues');
  const dc = document.getElementById('down-clues');
  words.forEach(w => {
    const d = document.createElement('div');
    d.className = 'cw-clue';
    d.dataset.num = w.num; d.dataset.dir = w.dir;
    d.innerHTML = `<b>${w.num}.</b> ${w.clue}`;
    d.onclick = () => { const i = getInput(w.row, w.col); if(i) { i.focus(); highlightWord(w.row, w.col); } };
    (w.dir === 'A' ? ac : dc).appendChild(d);
  });
}
buildGrid();
buildClues();
</script>
